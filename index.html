<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Your Name | Junior AI &amp; Software Engineer</title>
<meta name="description" content="Portfolio of Your Name, a junior AI and software engineer. Explore my skills and projects in 3D.">
<meta property="og:title" content="Your Name | Junior AI &amp; Software Engineer">
<meta property="og:description" content="Explore my skills and projects in an interactive 3D map.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9;--surface:#FFFFFF;--ink:#14213D;--muted:#4F5D75;--line:#D5DCE8;--accent:#2F5BEA;--mark:#F2A93B;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1626;--surface:#172037;--ink:#E7ECF5;--muted:#9AA8C2;--line:#2A3554;--accent:#7FA0FF}}
:root[data-theme="dark"]{--bg:#0F1626;--surface:#172037;--ink:#E7ECF5;--muted:#9AA8C2;--line:#2A3554;--accent:#7FA0FF}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(circle at 35% 45%,var(--surface),var(--bg) 70%),var(--bg);color:var(--ink);font:400 1rem/1.5 var(--body)}
button:focus-visible,a:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15}
#stage,#labels{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none;cursor:grab}
#labels{pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;font:600 .78rem var(--body);text-shadow:0 0 5px var(--bg),0 0 5px var(--bg),0 0 8px var(--bg)}
.lb.project{font:700 .95rem var(--head)}
.lb.sel{color:var(--accent)}
.fail{position:fixed;left:1.25rem;top:45%;max-width:22rem;color:var(--muted)}

.top{position:fixed;top:0;left:0;padding:calc(1rem + env(safe-area-inset-top,0px)) 1.25rem 0;max-width:30rem;pointer-events:none}
.top h1{font-size:1.7rem}
.top p{margin:.3rem 0 .6rem;color:var(--muted)}
.top a,.top button{pointer-events:auto}
.top nav{display:flex;gap:1rem;font-weight:600;margin-bottom:.75rem}
.top nav a{color:var(--accent);text-decoration:none}
.top nav a.cta{background:var(--accent);color:var(--surface);padding:.3rem .9rem;border-radius:6px}
#panel .pj{margin-bottom:.7rem}
#panel .pj p{margin:.3rem 0 0;color:var(--muted);font-size:.95rem}
#panel .hint{color:var(--muted);font-size:.9rem;margin-top:1rem}
noscript p{position:fixed;left:1.25rem;top:40%;max-width:24rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.chip,.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:.25rem .8rem;font:600 .9rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.chip i,.pill i{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;margin-right:.4rem}
.pill:hover{border-color:var(--accent)}
.pill.project::before{content:"";display:inline-block;width:.5rem;height:.5rem;background:var(--ink);transform:rotate(45deg);margin-right:.5rem}

#panel{position:fixed;right:1rem;top:calc(1rem + env(safe-area-inset-top,0px));bottom:calc(1rem + env(safe-area-inset-bottom,0px));width:22rem;overflow:auto;padding:1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:12px}
#panel h2{font-size:1.4rem;margin-bottom:.6rem}
#panel h3{font-size:1rem;margin:1.1rem 0 .5rem;color:var(--muted)}
#panel p{margin:0 0 .5rem}
#panel dl{margin:0;display:grid;gap:.6rem}
#panel dt{font-weight:600;color:var(--muted);font-size:.9rem}
#panel dd{margin:0}
.pills{display:flex;flex-wrap:wrap;gap:.5rem}
.back{background:none;border:0;color:var(--accent);font:600 .95rem var(--body);cursor:pointer;padding:0;margin-bottom:.75rem}
.meter{display:flex;gap:4px;margin:.4rem 0 .6rem}
.meter span{width:1.6rem;height:.5rem;border-radius:3px;background:var(--line)}
.meter span.on{background:var(--accent)}
.links{display:flex;gap:1.25rem;margin-top:1.1rem;font-weight:600}
.links a{color:var(--accent)}
@media (max-width:52rem){
  .top h1{font-size:1.35rem}
  .top p{display:none}
  #panel{left:0;right:0;top:auto;bottom:0;width:auto;max-height:40vh;border-radius:14px 14px 0 0;padding-bottom:calc(1rem + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels" aria-hidden="true"></div>
<header class="top">
  <h1 id="pName"></h1>
  <p id="pTag"></p>
  <nav id="pNav"></nav>
  <div class="chips" id="chips" role="group" aria-label="Filter skills by area"></div>
</header>
<aside id="panel" aria-live="polite"></aside>
<noscript><p>This portfolio needs JavaScript to show my projects. Please enable it and reload.</p></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== EDIT THIS BLOCK: your details, skills and projects ===== */
const PROFILE={
  name:'Your Name',
  title:'Junior AI & Software Engineer',
  pitch:'[Two sentences: what you build, and what kind of team you want to join.]',
  status:'Open to junior roles from [month, year]',
  location:'[City, Country], open to remote',
  email:'you@example.com',
  github:'https://github.com/your-username',
  linkedin:'https://linkedin.com/in/your-username',
  resume:'resume.pdf' // put your resume.pdf next to index.html
};
const CATS={ai:{n:'AI & data',c:'#3B6BEA'},sw:{n:'Software',c:'#E08A00'},ops:{n:'Workflow',c:'#1F9D6B'}};
const LEVELS=['','Learning','Basics','Comfortable','Strong','My best'];
const SKILLS=[ // lv = 1 to 5, sets the dot size
 {id:'python',n:'Python',cat:'ai',lv:5},{id:'pytorch',n:'PyTorch',cat:'ai',lv:3},
 {id:'sklearn',n:'scikit-learn',cat:'ai',lv:4},{id:'llm',n:'LLM APIs',cat:'ai',lv:4},
 {id:'rag',n:'RAG',cat:'ai',lv:3},{id:'pandas',n:'pandas',cat:'ai',lv:4},
 {id:'fastapi',n:'FastAPI',cat:'sw',lv:4},{id:'ts',n:'TypeScript',cat:'sw',lv:3},
 {id:'react',n:'React',cat:'sw',lv:3},{id:'sql',n:'SQL',cat:'sw',lv:4},
 {id:'git',n:'Git',cat:'ops',lv:4},{id:'docker',n:'Docker',cat:'ops',lv:3},{id:'tests',n:'Testing',cat:'ops',lv:3}
];
const PROJECTS=[
 {id:'p1',n:'[Project 1 name]',problem:'[Who has this problem and why it matters.]',built:'[What it does, in plain words.]',result:'[One number: accuracy, speed, users.]',skills:['python','llm','rag','fastapi','docker'],links:[['GitHub','#'],['Live demo','#']]},
 {id:'p2',n:'[Project 2 name]',problem:'[The question or task you set out to solve.]',built:'[e.g. a classifier trained on a public dataset.]',result:'[e.g. 92% test accuracy vs a baseline.]',skills:['python','pytorch','sklearn','pandas','git'],links:[['GitHub','#'],['Write-up','#']]},
 {id:'p3',n:'[Project 3 name]',problem:'[A non-AI project shows range.]',built:'[Describe it in plain words.]',result:'[Tests, users, or what you learned.]',skills:['ts','react','sql','tests','git'],links:[['GitHub','#'],['Live demo','#']]}
];
/* ===== end of editable block ===== */

const $=s=>document.querySelector(s);
document.title=`${PROFILE.name} | ${PROFILE.title}`;
$('#pName').textContent=PROFILE.name;
$('#pTag').textContent=PROFILE.title+'. Drag to spin, scroll to zoom, click any dot.';
$('#pNav').innerHTML=`<a class="cta" href="mailto:${PROFILE.email}">Email me</a><a href="${PROFILE.github}" target="_blank" rel="noopener">GitHub</a><a href="${PROFILE.linkedin}" target="_blank" rel="noopener">LinkedIn</a><a href="${PROFILE.resume}" target="_blank" rel="noopener">Resume</a>`;
const skillById=Object.fromEntries(SKILLS.map(s=>[s.id,s]));
const state={sel:null,cat:'all'};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let renderer,scene,camera,g,nodes=[],lines=[],hover=null,focusQ=null,dragging=false,moved=0,lx=0,ly=0;
const V=new THREE.Vector3(),ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),spin=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),.0018);

function addNode(d,type,pos,geo,size,hex){
  const mat=new THREE.MeshStandardMaterial({transparent:true,roughness:.45,emissiveIntensity:.35});
  if(hex){mat.color.set(hex);mat.emissive.set(hex)}
  const m=new THREE.Mesh(geo,mat);m.position.copy(pos);m.scale.setScalar(size);g.add(m);
  const el=document.createElement('div');el.className='lb '+type;el.textContent=d.n;$('#labels').appendChild(el);
  nodes.push({d,type,m,mat,el,size,on:1});
}
function init3D(){
  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  $('#stage').appendChild(renderer.domElement);
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(50,1,.1,100);
  scene.add(new THREE.AmbientLight(0xffffff,.7));
  const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(3,5,6);scene.add(dl);
  g=new THREE.Group();scene.add(g);
  const n=SKILLS.length;
  SKILLS.forEach((s,i)=>{
    const y=1-(i+.5)/n*2,r=Math.sqrt(1-y*y),t=i*2.4;
    addNode(s,'skill',new THREE.Vector3(Math.cos(t)*r,y,Math.sin(t)*r).multiplyScalar(4.2),new THREE.SphereGeometry(1,24,16),.16+s.lv*.06,CATS[s.cat].c);
  });
  PROJECTS.forEach((p,k)=>{
    const a=k*Math.PI*2/PROJECTS.length;
    addNode(p,'project',new THREE.Vector3(Math.cos(a)*1.5,(k-1)*.5,Math.sin(a)*1.5),new THREE.IcosahedronGeometry(1,1),.5);
  });
  PROJECTS.forEach(p=>{
    const a=nodes.find(x=>x.d===p).m.position;
    p.skills.forEach(id=>{
      const b=nodes.find(x=>x.d.id===id);if(!b)return;
      const ln=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b.m.position]),new THREE.LineBasicMaterial({transparent:true,opacity:.22}));
      ln.userData={p:p.id,s:id};g.add(ln);lines.push(ln);
    });
  });
  applyTheme();resize();
  const c=renderer.domElement;
  c.addEventListener('pointerdown',e=>{dragging=true;moved=0;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId);c.style.cursor='grabbing'});
  c.addEventListener('pointermove',e=>{
    if(dragging){
      const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);
      if(moved>4){focusQ=null;g.quaternion.premultiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(dy*.006,dx*.006,0)))}
    }else{hover=pick(e);c.style.cursor=hover?'pointer':'grab'}
  });
  c.addEventListener('pointerup',e=>{
    dragging=false;c.style.cursor='grab';
    if(moved<6){const h=pick(e);h?choose(h.type,h.d.id,true):choose(null)}
  });
  c.addEventListener('wheel',e=>{camera.position.z=Math.min(20,Math.max(6,camera.position.z+e.deltaY*.01))},{passive:true});
  addEventListener('resize',resize);
  new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
}
function pick(e){
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ndc,camera);
  const hit=ray.intersectObjects(nodes.filter(n=>n.on).map(n=>n.m))[0];
  return hit?nodes.find(n=>n.m===hit.object):null;
}
function resize(){
  const w=innerWidth,h=innerHeight,narrow=w<830;
  renderer.setSize(w,h);camera.aspect=w/h;camera.position.z=narrow?16:11;
  g.position.set(narrow?0:-1.4,narrow?1.3:0,0);camera.updateProjectionMatrix();
}
function applyTheme(){
  const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink').trim(),mu=cs.getPropertyValue('--muted').trim();
  nodes.forEach(n=>{if(n.type==='project'){n.mat.color.set(ink);n.mat.emissive.set(ink)}});
  lines.forEach(l=>l.material.color.set(mu));
}
function rel(n){
  const s=state.sel;
  if(s){
    if(n.d.id===s.id)return 1;
    if(s.type==='project')return PROJECTS.find(p=>p.id===s.id).skills.includes(n.d.id)?1:0;
    return n.type==='project'&&n.d.skills.includes(s.id)?1:0;
  }
  return state.cat==='all'||n.type==='project'||n.d.cat===state.cat?1:0;
}
function refresh(){
  nodes.forEach(n=>{n.on=rel(n);n.mat.opacity=n.on?1:.12;n.el.classList.toggle('sel',!!state.sel&&n.d.id===state.sel.id)});
  lines.forEach(l=>{
    const s=state.sel,u=l.userData;
    l.material.opacity=s?((s.id===u.p||s.id===u.s)?.85:.03):(state.cat==='all'||skillById[u.s].cat===state.cat?.22:.03);
  });
  document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.cat===state.cat)));
  renderPanel();
}
function choose(t,id,fromCanvas){
  if(!t){state.sel=null}
  else{
    state.sel=(state.sel&&state.sel.id===id&&!fromCanvas)?null:{type:t,id};
    const n=nodes.find(x=>x.d.id===id);
    if(state.sel&&n){
      focusQ=new THREE.Quaternion().setFromUnitVectors(n.m.position.clone().normalize(),new THREE.Vector3(0,0,1));
      if(reduce){g.quaternion.copy(focusQ);focusQ=null}
    }
  }
  refresh();
}
const pill=(t,id,label)=>`<button class="pill ${t}" data-t="${t}" data-id="${id}">${label}</button>`;
const skillPill=x=>pill('skill',x.id,`<i style="background:${CATS[x.cat].c}"></i>${x.n}`);
function renderPanel(){
  const s=state.sel;let h;
  if(!s){
    h=`<h2>${PROFILE.name}</h2><p>${PROFILE.pitch}</p>
    <dl><dt>Looking for</dt><dd>${PROFILE.status}</dd><dt>Based in</dt><dd>${PROFILE.location}</dd></dl>
    <h3>Projects</h3>${PROJECTS.map(p=>`<div class="pj">${pill('project',p.id,p.n)}<p>${p.result}</p></div>`).join('')}
    <h3>Skills</h3><div class="pills">${SKILLS.filter(x=>state.cat==='all'||x.cat===state.cat).map(skillPill).join('')}</div>
    <p class="hint">Diamonds are projects and dots are skills. Bigger dots mean I'm more comfortable with that skill. Lines show which skills went into which project.</p>`;
  }else if(s.type==='project'){
    const p=PROJECTS.find(x=>x.id===s.id);
    h=`<button class="back" data-t="back">Back to all</button><h2>${p.n}</h2>
    <dl><dt>Problem</dt><dd>${p.problem}</dd><dt>What I built</dt><dd>${p.built}</dd><dt>Result</dt><dd>${p.result}</dd></dl>
    <h3>Skills used</h3><div class="pills">${p.skills.map(i=>skillById[i]).filter(Boolean).map(skillPill).join('')}</div>
    <div class="links">${p.links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${l[0]}</a>`).join('')}</div>`;
  }else{
    const x=skillById[s.id],used=PROJECTS.filter(p=>p.skills.includes(x.id));
    h=`<button class="back" data-t="back">Back to all</button><h2>${x.n}</h2>
    <p>${CATS[x.cat].n}. Level ${x.lv} of 5: <b>${LEVELS[x.lv]}</b></p>
    <div class="meter">${'<span class="on"></span>'.repeat(x.lv)+'<span></span>'.repeat(5-x.lv)}</div>
    <h3>Where I used it</h3>${used.length?`<div class="pills">${used.map(p=>pill('project',p.id,p.n)).join('')}</div>`:'<p>Not in a project yet.</p>'}`;
  }
  $('#panel').innerHTML=h;
}
$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  b.dataset.t==='back'?choose(null):choose(b.dataset.t,b.dataset.id);
});
$('#chips').innerHTML=[['all','All','var(--muted)'],...Object.entries(CATS).map(([k,v])=>[k,v.n,v.c])]
  .map(([k,n,c])=>`<button class="chip" data-cat="${k}" aria-pressed="false"><i style="background:${c}"></i>${n}</button>`).join('');
$('#chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;state.cat=b.dataset.cat;state.sel=null;refresh();
});
function tick(){
  if(!dragging){
    if(focusQ){g.quaternion.slerp(focusQ,.07);if(g.quaternion.angleTo(focusQ)<.002)focusQ=null}
    else if(!reduce&&!state.sel)g.quaternion.premultiply(spin);
  }
  nodes.forEach(n=>n.m.scale.setScalar(n.size*(n===hover&&n.on?1.3:1)));
  renderer.render(scene,camera);
  const w=innerWidth,h=innerHeight;
  nodes.forEach(n=>{
    n.m.getWorldPosition(V);const d=camera.position.distanceTo(V);V.project(camera);
    n.el.style.transform=`translate(${(V.x*.5+.5)*w}px,${(-V.y*.5+.5)*h}px) translate(-50%,${n.type==='project'?22:13}px)`;
    n.el.style.opacity=n.on?Math.min(1,Math.max(.3,1.7-d/9)):.12;
  });
  requestAnimationFrame(tick);
}
try{init3D();refresh();tick()}
catch(err){
  $('#stage').innerHTML='<p class="fail">The 3D view needs WebGL, which this device or browser has turned off. The lists still work.</p>';
  refresh();
}
</script>
</body>
</html>
